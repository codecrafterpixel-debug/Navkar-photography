<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Navkar Photography - Admin Panel</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .admin-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .admin-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .admin-content {
            padding: 30px;
        }

        /* Login Section */
        .login-section {
            display: none;
            text-align: center;
        }

        .login-section.active {
            display: block;
        }

        .login-section input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            margin: 15px auto;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            display: block;
        }

        .login-section button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .login-section button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Upload Section */
        .upload-section {
            display: none;
        }

        .upload-section.active {
            display: block;
        }

        .logout-btn {
            float: right;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .form-group {
            margin-bottom: 25px;
            clear: both;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            font-size: 16px;
        }

        .form-group select,
        .form-group input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            color: #667eea;
            font-weight: bold;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #667eea;
            color: white;
        }

        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
        }

        .file-item {
            padding: 8px 12px;
            background: white;
            margin: 5px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .file-item .remove-file {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .file-item .remove-file:hover {
            background: #c0392b;
        }

        .upload-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            display: none;
            font-weight: bold;
        }

        .status-message.active {
            display: block;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .gallery-preview {
            margin-top: 30px;
            border-top: 2px solid #ddd;
            padding-top: 30px;
        }

        .gallery-preview h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .image-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            aspect-ratio: 1;
            background: #f0f0f0;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-item .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s;
        }

        .image-item:hover .delete-btn {
            opacity: 1;
        }

        .image-item .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        .no-images {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        @media (max-width: 600px) {
            .admin-header h1 {
                font-size: 20px;
            }

            .admin-content {
                padding: 20px;
            }

            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
        }
    </style>
    </head>
    <body>
        <div class="admin-container">
            <div class="admin-header">
                <h1>📸 Navkar Photography</h1>
                <p>Admin Panel - Image Management</p>
            </div>

            <div class="admin-content">
                <!-- Login Section -->
                <div class="login-section active">
                    <h2 style="margin-bottom: 20px; color: #333;">Admin
                        Login</h2>
                    <input type="password" id="adminPassword"
                        placeholder="Enter admin password" />
                    <button onclick="loginAdmin()">Login</button>
                    <p style="margin-top: 20px; color: #999; font-size: 14px;">
                        Default password: your-secure-password-here
                    </p>
                </div>

                <!-- Upload Section -->
                <div class="upload-section">
                    <button class="logout-btn"
                        onclick="logoutAdmin()">Logout</button>

                    <h2 style="margin-bottom: 20px; color: #333;">Upload
                        Images</h2>

                    <div class="form-group">
                        <label for="gallerySelect">Select Gallery:</label>
                        <select id="gallerySelect" onchange="onGalleryChange()">
                            <option value>-- Choose a gallery --</option>
                            <option value="wedding-jheel-neeraj">Wedding: Jheel
                                & Neeraj</option>
                            <option value="wedding-mauli-pankil">Wedding: Mauli
                                & Pankil</option>
                            <option value="wedding-mihir-maitry">Wedding: Mihir
                                & Maitry</option>
                            <option value="religious-aarohan-updhyan">Religious:
                                Aarohan Updhyan Tap</option>
                            <option value="religious-mahapuja">Religious:
                                Mahapuja</option>
                            <option
                                value="religious-shakrastav-aabhishek">Religious:
                                Shakrastav Maha Aabhishek</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Select Images (Multiple):</label>
                        <div class="file-input-wrapper">
                            <label class="file-input-label" for="imageInput">
                                Click here or drag images to upload
                            </label>
                            <input type="file" id="imageInput" multiple
                                accept="image/*" onchange="onFilesSelected()" />
                        </div>
                    </div>

                    <div id="fileList" class="file-list"
                        style="display: none;"></div>

                    <div id="progressBar" class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>

                    <button class="upload-btn" id="uploadBtn"
                        onclick="uploadImages()" disabled>
                        Upload Images
                    </button>

                    <div id="statusMessage" class="status-message"></div>

                    <!-- Gallery Preview -->
                    <div id="galleryPreview" class="gallery-preview"
                        style="display: none;">
                        <h3>Images in Selected Gallery</h3>
                        <div id="imageGrid" class="image-grid"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Supabase Library -->
        <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <!-- Supabase Configuration -->
        <script src="supabase-config.js"></script>

        <script>
        let selectedFiles = [];
        let currentBucket = '';
        const adminPassword = typeof ADMIN_PASSWORD !== 'undefined' ? ADMIN_PASSWORD : 'Karan2112'; // Fallback just in case

        function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            if (password === adminPassword) {
                document.querySelector('.login-section').classList.remove('active');
                document.querySelector('.upload-section').classList.add('active');
                showStatus('Logged in successfully!', 'success');
            } else {
                showStatus('Invalid password', 'error');
            }
        }

        function logoutAdmin() {
            document.querySelector('.login-section').classList.add('active');
            document.querySelector('.upload-section').classList.remove('active');
            document.getElementById('adminPassword').value = '';
            selectedFiles = [];
            currentBucket = '';
            updateFileList();
        }

        function onGalleryChange() {
            currentBucket = document.getElementById('gallerySelect').value;
            if (currentBucket) {
                loadGalleryPreview();
            }
        }

        function onFilesSelected() {
            const input = document.getElementById('imageInput');
            selectedFiles = Array.from(input.files);
            updateFileList();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            
            if (selectedFiles.length === 0) {
                fileList.style.display = 'none';
                document.getElementById('uploadBtn').disabled = true;
                return;
            }

            fileList.style.display = 'block';
            fileList.innerHTML = '<strong>Selected Files:</strong><br>';

            selectedFiles.forEach((file, index) => {
                fileList.innerHTML += `
                    <div class="file-item">
                        <span>${file.name} (${(file.size / 1024).toFixed(2)} KB)</span>
                        <button class="remove-file" onclick="removeFile(${index})">Remove</button>
                    </div>
                `;
            });

            document.getElementById('uploadBtn').disabled = false;
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        async function uploadImages() {
            if (!currentBucket || selectedFiles.length === 0) {
                showStatus('Please select a gallery and files', 'error');
                return;
            }

            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('progressBar').classList.add('active');
            let uploaded = 0;

            for (const file of selectedFiles) {
                const result = await SupabaseAPI.uploadImageToSupabase(file, currentBucket);
                if (result) {
                    uploaded++;
                }
                const progress = (uploaded / selectedFiles.length) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
            }

            showStatus(`Successfully uploaded ${uploaded}/${selectedFiles.length} images`, 'success');
            selectedFiles = [];
            document.getElementById('imageInput').value = '';
            updateFileList();
            document.getElementById('progressBar').classList.remove('active');
            document.getElementById('uploadBtn').disabled = false;
            loadGalleryPreview();
        }

        async function loadGalleryPreview() {
            if (!currentBucket) return;

            const images = await SupabaseAPI.getImagesFromBucket(currentBucket);
            const imageGrid = document.getElementById('imageGrid');
            const galleryPreview = document.getElementById('galleryPreview');

            if (images.length === 0) {
                imageGrid.innerHTML = '<div class="no-images">No images in this gallery yet</div>';
                galleryPreview.style.display = 'block';
                return;
            }

            imageGrid.innerHTML = images.map(img => `
                <div class="image-item">
                    <img src="${img.url}" alt="Gallery image" onerror="this.src='https://via.placeholder.com/120?text=Error'" />
                    <button class="delete-btn" onclick="deleteImage('${img.bucket}', '${img.name}')" title="Delete">🗑️</button>
                </div>
            `).join('');

            galleryPreview.style.display = 'block';
        }

        async function deleteImage(bucket, fileName) {
            if (!confirm('Are you sure you want to delete this image?')) return;

            const success = await SupabaseAPI.deleteImageFromSupabase(bucket, fileName);
            if (success) {
                showStatus('Image deleted successfully', 'success');
                loadGalleryPreview();
            } else {
                showStatus('Failed to delete image', 'error');
            }
        }

        function showStatus(message, type) {
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = message;
            statusMsg.className = `status-message active ${type}`;
            setTimeout(() => {
                statusMsg.classList.remove('active');
            }, 4000);
        }

        // Drag and drop support
        const imageInput = document.getElementById('imageInput');
        const fileInputLabel = document.querySelector('.file-input-label');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileInputLabel.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            fileInputLabel.addEventListener(eventName, () => {
                fileInputLabel.style.background = '#667eea';
                fileInputLabel.style.color = 'white';
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            fileInputLabel.addEventListener(eventName, () => {
                fileInputLabel.style.background = '#f8f9fa';
                fileInputLabel.style.color = '#667eea';
            });
        });

        fileInputLabel.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            imageInput.files = files;
            onFilesSelected();
        });
    </script>
    </body>
</html>
