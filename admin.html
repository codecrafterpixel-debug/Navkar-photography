<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Navkar Photography - Admin Panel</title>
        <link href="https://fonts.googleapis.com" rel="preconnect"/>
        <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"/>
        <link crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer" rel="stylesheet"/>
        <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f2ec;
            color: #24211e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 500;
        }

        .admin-container {
            background: #fff;
            border: 1px solid rgba(30, 28, 25, 0.1);
            border-radius: 2px;
            max-width: 900px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .admin-header {
            background: #24211e;
            color: #f5f2ec;
            padding: 40px 30px;
            text-align: center;
        }

        .admin-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-style: italic;
        }

        .admin-header p {
            opacity: 0.8;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .admin-content {
            padding: 40px 30px;
        }

        /* Login Section */
        .login-section {
            display: none;
            text-align: center;
        }

        .login-section.active {
            display: block;
        }
        
        .login-section h2 {
            margin-bottom: 25px;
            font-size: 28px;
            font-style: italic;
        }

        .login-section input {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            margin: 20px auto;
            border: 1px solid rgba(30, 28, 25, 0.2);
            border-radius: 2px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            display: block;
            outline: none;
            transition: border-color 0.3s;
        }

        .login-section input:focus {
            border-color: #24211e;
        }

        .login-section button {
            background: #24211e;
            color: #f5f2ec;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
            transition: all 0.3s;
        }

        .login-section button:hover {
            background: #3a3631;
        }
        
        .login-section p {
            margin-top: 25px;
            color: #777;
            font-size: 12px;
        }

        /* Upload Section */
        .upload-section {
            display: none;
        }

        .upload-section.active {
            display: block;
        }
        
        .upload-section h2 {
            margin-bottom: 30px;
            font-size: 28px;
            font-style: italic;
        }

        .logout-btn {
            float: right;
            background: transparent;
            color: #24211e;
            border: 1px solid rgba(30, 28, 25, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #24211e;
            color: #f5f2ec;
        }

        .form-group {
            margin-bottom: 30px;
            clear: both;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: #777;
        }

        .form-group select,
        .form-group input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(30, 28, 25, 0.2);
            border-radius: 2px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            color: #24211e;
            transition: border-color 0.3s;
            outline: none;
            cursor: pointer;
            background: #fff;
        }

        .form-group select:focus {
            border-color: #24211e;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-label {
            display: block;
            padding: 30px 15px;
            background: #fcfcfc;
            border: 1px dashed rgba(30, 28, 25, 0.3);
            border-radius: 2px;
            cursor: pointer;
            text-align: center;
            color: #777;
            font-size: 14px;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            border-color: #24211e;
            color: #24211e;
        }

        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            background: #fcfcfc;
            border: 1px solid rgba(30, 28, 25, 0.1);
            border-radius: 2px;
            padding: 15px;
        }

        .file-item {
            padding: 10px;
            background: #fff;
            margin: 5px 0;
            border: 1px solid rgba(30, 28, 25, 0.05);
            border-radius: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .file-item .remove-file {
            background: transparent;
            color: #e74c3c;
            border: none;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .file-item .remove-file:hover {
            text-decoration: underline;
        }

        .upload-btn {
            width: 100%;
            padding: 16px;
            background: #24211e;
            color: #f5f2ec;
            border: none;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .upload-btn:hover {
            background: #3a3631;
        }

        .upload-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(30, 28, 25, 0.1);
            margin: 25px 0;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: #24211e;
            width: 0%;
            transition: width 0.3s;
        }

        .status-message {
            padding: 15px;
            border-radius: 2px;
            margin: 20px 0;
            display: none;
            font-size: 13px;
            text-align: center;
        }

        .status-message.active {
            display: block;
        }

        .status-message.success {
            background: #f5f2ec;
            color: #24211e;
            border: 1px solid rgba(30, 28, 25, 0.2);
        }

        .status-message.error {
            background: #fdf5f5;
            color: #c0392b;
            border: 1px solid #fadbd8;
        }

        .status-message.info {
            background: #f4f6f7;
            color: #2c3e50;
            border: 1px solid #d5dbdb;
        }

        .gallery-preview {
            margin-top: 40px;
            border-top: 1px solid rgba(30, 28, 25, 0.1);
            padding-top: 40px;
        }

        .gallery-preview h3 {
            margin-bottom: 25px;
            font-size: 24px;
            font-style: italic;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .image-item {
            position: relative;
            overflow: hidden;
            border-radius: 2px;
            aspect-ratio: 1;
            background: #f5f2ec;
            border: 1px solid rgba(30, 28, 25, 0.05);
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .image-item:hover img {
            transform: scale(1.05);
        }

        .image-item .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #e74c3c;
            border: 1px solid rgba(0,0,0,0.1);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .image-item:hover .delete-btn {
            opacity: 1;
        }

        .image-item .delete-btn:hover {
            background: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }

        .no-images {
            text-align: center;
            color: #777;
            padding: 40px;
            font-style: italic;
            border: 1px dashed rgba(30, 28, 25, 0.2);
            border-radius: 2px;
        }

        @media (max-width: 600px) {
            .admin-header {
                padding: 30px 20px;
            }

            .admin-header h1 {
                font-size: 24px;
            }

            .admin-content {
                padding: 30px 20px;
            }

            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
        }
    </style>
    </head>
    <body>
        <div class="admin-container">
            <div class="admin-header">
                <h1>📸 Navkar Photography</h1>
                <p>Admin Panel - Image Management</p>
            </div>

            <div class="admin-content">
                <!-- Login Section -->
                <div class="login-section active">
                    <h2>Admin Login</h2>
                    <input type="password" id="adminPassword"
                        placeholder="Enter admin password" />
                    <button onclick="loginAdmin()">Login</button>
                    <p>
                        Default password: your-secure-password-here
                    </p>
                </div>

                <!-- Upload Section -->
                <div class="upload-section">
                    <button class="logout-btn"
                        onclick="logoutAdmin()">Logout</button>

                    <h2>Upload Images</h2>

                    <div class="form-group">
                        <label for="gallerySelect">Select Gallery:</label>
                        <select id="gallerySelect" onchange="onGalleryChange()">
                            <option value>-- Choose a gallery --</option>
                            <option value="wedding-jheel-neeraj">Wedding: Jheel
                                & Neeraj</option>
                            <option value="wedding-mauli-pankil">Wedding: Mauli
                                & Pankil</option>
                            <option value="wedding-mihir-maitry">Wedding: Mihir
                                & Maitry</option>
                            <option value="religious-aarohan-updhyan">Religious:
                                Aarohan Updhyan Tap</option>
                            <option value="religious-mahapuja">Religious:
                                Mahapuja</option>
                            <option
                                value="religious-shakrastav-aabhishek">Religious:
                                Shakrastav Maha Aabhishek</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Select Images (Multiple):</label>
                        <div class="file-input-wrapper">
                            <label class="file-input-label" for="imageInput">
                                Click here or drag images to upload
                            </label>
                            <input type="file" id="imageInput" multiple
                                accept="image/*" onchange="onFilesSelected()" />
                        </div>
                    </div>

                    <div id="fileList" class="file-list"
                        style="display: none;"></div>

                    <div id="progressBar" class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>

                    <button class="upload-btn" id="uploadBtn"
                        onclick="uploadImages()" disabled>
                        Upload Images
                    </button>

                    <div id="statusMessage" class="status-message"></div>

                    <!-- Gallery Preview -->
                    <div id="galleryPreview" class="gallery-preview"
                        style="display: none;">
                        <h3>Images in Selected Gallery</h3>
                        <div id="imageGrid" class="image-grid"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Supabase Library -->
        <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <!-- Supabase Configuration -->
        <script src="supabase-config.js"></script>

        <script>
        let selectedFiles = [];
        let currentBucket = '';
        const adminPassword = typeof ADMIN_PASSWORD !== 'undefined' ? ADMIN_PASSWORD : 'Karan2112'; // Fallback just in case

        function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            if (password === adminPassword) {
                document.querySelector('.login-section').classList.remove('active');
                document.querySelector('.upload-section').classList.add('active');
                showStatus('Logged in successfully!', 'success');
            } else {
                showStatus('Invalid password', 'error');
            }
        }

        function logoutAdmin() {
            document.querySelector('.login-section').classList.add('active');
            document.querySelector('.upload-section').classList.remove('active');
            document.getElementById('adminPassword').value = '';
            selectedFiles = [];
            currentBucket = '';
            updateFileList();
        }

        function onGalleryChange() {
            currentBucket = document.getElementById('gallerySelect').value;
            if (currentBucket) {
                loadGalleryPreview();
            }
        }

        function onFilesSelected() {
            const input = document.getElementById('imageInput');
            selectedFiles = Array.from(input.files);
            updateFileList();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            
            if (selectedFiles.length === 0) {
                fileList.style.display = 'none';
                document.getElementById('uploadBtn').disabled = true;
                return;
            }

            fileList.style.display = 'block';
            fileList.innerHTML = '<strong>Selected Files:</strong><br>';

            selectedFiles.forEach((file, index) => {
                fileList.innerHTML += `
                    <div class="file-item">
                        <span>${file.name} (${(file.size / 1024).toFixed(2)} KB)</span>
                        <button class="remove-file" onclick="removeFile(${index})">Remove</button>
                    </div>
                `;
            });

            document.getElementById('uploadBtn').disabled = false;
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        async function uploadImages() {
            if (!currentBucket || selectedFiles.length === 0) {
                showStatus('Please select a gallery and files', 'error');
                return;
            }

            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('progressBar').classList.add('active');
            let uploaded = 0;
            let lastError = null;

            for (const file of selectedFiles) {
                const result = await SupabaseAPI.uploadImageToSupabase(file, currentBucket);
                if (result && !result.error) {
                    uploaded++;
                } else if (result && result.error) {
                    lastError = result.error;
                }
                const progress = (uploaded / selectedFiles.length) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
            }

            if (uploaded === selectedFiles.length) {
                showStatus(`Successfully uploaded ${uploaded}/${selectedFiles.length} images`, 'success');
            } else {
                showStatus(`Uploaded ${uploaded}/${selectedFiles.length} images. Error: ${lastError || 'Unknown error'}`, 'error');
            }
            
            selectedFiles = [];
            document.getElementById('imageInput').value = '';
            updateFileList();
            document.getElementById('progressBar').classList.remove('active');
            document.getElementById('uploadBtn').disabled = false;
            loadGalleryPreview();
        }

        async function loadGalleryPreview() {
            if (!currentBucket) return;

            const images = await SupabaseAPI.getImagesFromBucket(currentBucket);
            const imageGrid = document.getElementById('imageGrid');
            const galleryPreview = document.getElementById('galleryPreview');

            if (images.length === 0) {
                imageGrid.innerHTML = '<div class="no-images">No images in this gallery yet</div>';
                galleryPreview.style.display = 'block';
                return;
            }

            imageGrid.innerHTML = images.map(img => `
                <div class="image-item">
                    <img src="${img.url}" alt="Gallery image" onerror="this.src='https://via.placeholder.com/120?text=Error'" />
                    <button class="delete-btn" onclick="deleteImage('${img.bucket}', '${img.name}')" title="Delete">🗑️</button>
                </div>
            `).join('');

            galleryPreview.style.display = 'block';
        }

        async function deleteImage(bucket, fileName) {
            if (!confirm('Are you sure you want to delete this image?')) return;

            const success = await SupabaseAPI.deleteImageFromSupabase(bucket, fileName);
            if (success) {
                showStatus('Image deleted successfully', 'success');
                loadGalleryPreview();
            } else {
                showStatus('Failed to delete image', 'error');
            }
        }

        function showStatus(message, type) {
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = message;
            statusMsg.className = `status-message active ${type}`;
            setTimeout(() => {
                statusMsg.classList.remove('active');
            }, 4000);
        }

        // Drag and drop support
        const imageInput = document.getElementById('imageInput');
        const fileInputLabel = document.querySelector('.file-input-label');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileInputLabel.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            fileInputLabel.addEventListener(eventName, () => {
                fileInputLabel.style.background = '#667eea';
                fileInputLabel.style.color = 'white';
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            fileInputLabel.addEventListener(eventName, () => {
                fileInputLabel.style.background = '#f8f9fa';
                fileInputLabel.style.color = '#667eea';
            });
        });

        fileInputLabel.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            imageInput.files = files;
            onFilesSelected();
        });
    </script>
    </body>
</html>
